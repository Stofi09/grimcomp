name: rn-ci

# Type-check the React Native (Expo) app on changes to its sources. The web app
# has its own workflow (web-ci.yml); this guards the native side, which would
# otherwise get no CI at all. The root tsconfig excludes web/, so this checks the
# RN tree only.
on:
  push:
    paths:
      - 'src/**'
      - 'packages/core/**'
      - 'App.tsx'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/rn-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'packages/core/**'
      - 'App.tsx'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/rn-ci.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: `cache: pnpm` needs pnpm already on PATH.
      # Version comes from the package.json `packageManager` field.
      - uses: pnpm/action-setup@v4
      # node-version must stay >= 22.13: pnpm 11.5 loads node:sqlite, so it
      # crashes on Node 20 during setup-node's own `pnpm store path` probe.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # --ignore-scripts skips sharp's native build: it exists only for
      # `pnpm run icons` (scripts/generate-icons.js), and a typecheck never
      # loads it. Root pnpm-workspace.yaml keeps `allowBuilds: sharp: true`
      # so a local install still builds it.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:core-boundary
      - run: pnpm run tsc:core
      - run: pnpm run tsc
