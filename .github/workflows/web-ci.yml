name: web-ci

# Type-check, test, and build the web app on changes under web/ or the shared
# core package it imports.
# This is the PR0 safety net: the regression-locked content packs and the pure
# engine tests run here so a broken pack or a regressed formula fails CI instead
# of white-screening the deployed app.
#
# web/ is its own pnpm workspace root (web/pnpm-workspace.yaml sets
# `packages: []`), so installing with cwd=web is isolated from the root Expo app.
# The suite also imports root native modules (src/**) and the content audit
# script (scripts/**). Their TypeScript config extends `expo/tsconfig.base`, so
# the root workspace must be installed too, and changes there trigger this job.
on:
  push:
    paths: ['web/**', 'packages/core/**', 'src/**', 'scripts/**', 'tsconfig.json', 'package.json', 'pnpm-lock.yaml', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', 'packages/core/**', 'src/**', 'scripts/**', 'tsconfig.json', 'package.json', 'pnpm-lock.yaml', '.github/workflows/web-ci.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: `cache: pnpm` needs pnpm already on PATH.
      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4
      # node-version must stay >= 22.13: pnpm 11.5 loads node:sqlite, so it
      # crashes on Node 20 during setup-node's own `pnpm store path` probe.
      # 24 matches the server and deployment jobs (and the release builder).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm run check:no-scratch
      # Root install for the native modules the web suite imports. The web
      # build never bundles them. --ignore-scripts skips sharp's native build,
      # which only `pnpm run icons` uses.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:core-boundary
      - run: pnpm run tsc:core
      - run: pnpm run tsc
      - run: pnpm run lint
      # Vitest's per-test timeout cannot interrupt a synchronous event-loop hang.
      - run: timeout 2m pnpm test
      - run: pnpm run build
