name: web-ci

# Type-check, test, and build the web app on every change under web/.
# This is the PR0 safety net: the regression-locked content packs and the pure
# engine tests run here so a broken pack or a regressed formula fails CI instead
# of white-screening the deployed app.
on:
  push:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm test
      - run: npm run build
