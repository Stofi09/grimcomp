name: web-ci

# Type-check, test, and build the web app on every change under web/.
# This is the PR0 safety net: the regression-locked content packs and the pure
# engine tests run here so a broken pack or a regressed formula fails CI instead
# of white-screening the deployed app.
#
# web/ is its own pnpm workspace root (web/pnpm-workspace.yaml sets
# `packages: []`), so installing with cwd=web is isolated from the root Expo app.
on:
  push:
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-ci.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: `cache: pnpm` needs pnpm already on PATH.
      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4
      # node-version must stay >= 22.13: pnpm 11.5 loads node:sqlite, so it
      # crashes on Node 20 during setup-node's own `pnpm store path` probe.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
